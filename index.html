<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cotizador PRO</title>

<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="db.js"></script>
<script src="app.js" defer></script>

<!-- Firebase SDK (cargado dinámicamente desde db.js) -->
<script>
    // Configuración de Firebase - COMPLETA ESTOS DATOS desde Firebase Console
    // Ve a: https://console.firebase.google.com/
    // 1. Crea un proyecto
    // 2. Agrega una "Web App"
    // 3. Copia la configuración aquí
    /*
    const firebaseConfig = {
        apiKey: "AIzaSy...",
        authDomain: "tu-proyecto.firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abc123"
    };
    */
</script>

</head>

<body>

<div class="container">

<!-- Encabezado con Logo y Título -->
<div class="header-section">
    <img id="logoPreview" src="" alt="Logo" style="display:none; max-height:80px;">
    <div class="header-text">
        <h1>Cotización</h1>
    </div>
</div>

<!-- Logo -->
<div class="logo-section">
    <input type="file" id="logoInput" accept="image/*" onchange="cargarLogo()">
    <button onclick="guardarLogo()">Guardar Logo</button>
    <button onclick="borrarLogo()">Borrar</button>
</div>

<div class="card">
<h3>Empresa</h3>
<div class="grid">
<input id="empresaNombre" placeholder="Nombre">
<input id="empresaRut" placeholder="RUT">
<input id="empresaDireccion" placeholder="Dirección">
<input id="empresaTelefono" placeholder="Teléfono">
</div>
<br>
<button onclick="guardarEmpresa()">Guardar Empresa</button>
<button onclick="cargarEmpresa()">Cargar</button>
</div>

<div class="card">
<h3>Cliente</h3>
<div class="grid">
<input id="clienteNombre" placeholder="Nombre">
<input id="clienteRut" placeholder="RUT">
<input id="clienteDireccion" placeholder="Dirección">
<input id="clienteCorreo" placeholder="Correo">
</div>
<br>
<button onclick="guardarCliente()">Guardar Cliente</button>
<button onclick="mostrarClientes()">Mis Clientes</button>
</div>

<div class="card">
<h3>Proyecto</h3>
<div class="grid">
<input id="folio" readonly>
<input id="fecha" readonly>
<input id="proyectoNombre" placeholder="Nombre del Proyecto">
<input id="proyectoCodigo" placeholder="Código">
</div>
<br>
<button onclick="guardarProyecto()">Guardar</button>
<button onclick="cargarProyecto()">Cargar</button>
</div>

<div class="card">
<h3>Buscar Cotización</h3>
<div class="grid">
<input id="buscarCotizacion" placeholder="Buscar por cliente, folio o código..." oninput="buscarCotizacion(this.value)">
</div>
<div id="resultadosBusqueda" style="margin-top:10px; max-height:200px; overflow-y:auto;"></div>
</div>

<div class="card">
<h3>Productos</h3>

<div class="grid">
<input id="nombre" placeholder="Producto">
<input id="cantidad" type="number" placeholder="Cantidad">
<input id="precio" placeholder="Precio">
</div>

<br>
<button onclick="agregarProducto()">Agregar</button>
<button onclick="guardarProducto()">Guardar Producto</button>
<button onclick="mostrarProductos()">Mis Productos</button>

<table>
<thead>
<tr>
<th>Producto</th>
<th>Cant</th>
<th>Precio</th>
<th>Subtotal</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="detalle"></tbody>
</table>

<div class="total">
Total Neto: $<span id="total">0</span>
</div>

<br>
<button onclick="generarPDF()">Descargar PDF</button>
<button onclick="exportarDatos()">Exportar Datos</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importarDesdeArchivo()">
<button onclick="document.getElementById('importFile').click()">Importar Datos</button>
<button onclick="importarDesdeFirebase()">📥 Importar Cliente</button>
<button onclick="importarProductosDesdeFirebase()">📦 Importar Producto</button>

</div>

</div>

</body>
</html>
